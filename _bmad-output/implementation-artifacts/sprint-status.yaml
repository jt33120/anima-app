  # sont bien inscrites ici. Renommer une clé `porte:` fait rougir la CI — c'est voulu : un verdict
  # dont la garde humaine a disparu du suivi est un verdict qui ne repose plus sur rien.
  - gate: "conservation-comptable — confirmer la durée de conservation des pièces chez le prestataire de paiement, et que l'effacement d'un compte ne les touche pas (obligation légale)"
    concerne: "Epic 6 (6.7), Epic 3 (Stripe)"
    status: open
  - gate: "sous-traitant-transcription — aucun prestataire de transcription n'est lié ; en lier un exige un DPA art. 28 + ZDR ET un verdict de propagation d'effacement"
    concerne: "Epic 6 (6.7), NFR-003/NFR-004"
    status: open
