  # zlhlzoalmszohrxrnsmo : le PITR n'est pas « à régler », il est ÉTEINT. Ce qui existe est
  # `walg_enabled: true`, dont la rétention n'est écrite nulle part de notre côté. Les 7 jours
  # annoncés dans chaque trace d'effacement et sur `/mes-donnees` ne mesurent donc RIEN. Deux issues
  # acceptables, une seule à choisir : activer le PITR sur la durée annoncée, OU constater la
