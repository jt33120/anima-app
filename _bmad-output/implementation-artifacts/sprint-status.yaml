  - gate: "Licence Swiss Ephemeris pro (700 CHF) — UNIQUEMENT pour Chiron et les astéroïdes"
    concerne: "Epic 5 (5.1, 5.3, 5.4)"
    status: reduit # 2026-08-07 : ne bloque plus le développement
    note: >
      RE-CADRÉE le 2026-08-07 (décision Julian). L'adaptateur v1 est `astronomy-engine@2.1.19` (MIT,
      zéro dépendance, ±1 minute d'arc, VSOP87/NOVAS) : il couvre les dix corps, le temps sidéral
      (donc ascendant/MC/maisons) et les nœuds lunaires moyen ET vrai. Le développement de l'Epic 5
      n'est donc PLUS bloqué, et le calcul est gratuit et sans copyleft.
      CE QUI RESTE OUVERT : `astronomy-engine` n'a AUCUN astéroïde — donc pas de CHIRON, que Julian a
      déclaré indispensable le 2026-08-07. Le thème natal porte un créneau `chiron: non_calcule` avec
      sa raison (discipline FR-050) et il est VERSIONNÉ : le jour où une source de Chiron existe,
      l'adaptateur la fournit, la version s'incrémente, zéro ligne de domaine à réécrire.
      Trois voies pour Chiron, à trancher avant lancement : (a) licence Swiss Ephemeris pro, 700 CHF
      paiement unique — sans elle `sweph` est AGPL-3.0 et l'app entière devrait passer en open source ;
      (b) table d'éphéméride Chiron pré-calculée depuis JPL Horizons (données NASA non copyrightées),
      interpolée — Chiron bouge ~7°/an, une table à pas de 10 jours sur 1900-2050 tient en ~60 Ko ;
      (c) renoncer à Chiron. NE JAMAIS l'approximer par propagation képlérienne : la dérive atteint
      plusieurs signes, et un Chiron faux est pire qu'un Chiron absent — il a l'air juste.
  - gate: "LE CORPUS D'ANIMA — les textes d'interprétation, écrits par Anima et par personne d'autre"
    concerne: "Epic 5 (5.2, 5.4, 5.5, 5.7, 5.8) — transverse à tout le socle"
    status: open
    note: >
      OUVERTE le 2026-08-07 en contextant la 5.2. FR-054 exige que les interprétations viennent du
      CORPUS D'ANIMA, et FR-086 rappelle qu'Anima est une PERSONNE RÉELLE dont Anam ne fabrique
      jamais une parole. Les trois façons de remplir ces textes sans elle sont toutes interdites :
      les faire générer par un modèle (FR-047 + FR-054), les écrire moi-même (c'est alors du texte
      générique repris, exactement ce que FR-054 bannit), les acheter ou les recopier (FR-054 + droit
      d'auteur). Dans les trois cas ils finissent signés du nom d'une personne identifiable.
      CONSÉQUENCE ASSUMÉE : la 5.2 livre la numérologie avec ZÉRO interprétation écrite. Le corpus
      est une structure COMPLÈTE et VIDE — 69 créneaux déclarés, tous `non_ecrit`, chacun rendu
      honnêtement comme non écrit plutôt que rempli d'un texte plausible (même discipline que Chiron
      en 5.1 et que FR-050, « je préfère ne pas te l'inventer »).
      CE QU'IL FAUT D'ANIMA, par ordre d'urgence : (a) les 12 textes du CHEMIN DE VIE — c'est le
      nombre que les gens connaissent, il suffit à rendre la carte de numérologie vivante ;
      (b) les 12 du nombre d'EXPRESSION ; (c) les 45 restants (intime, personnalité, jour de
      naissance, année personnelle). La fiche d'écriture est
      `_bmad-output/implementation-artifacts/corpus-numerologie-a-ecrire.md` : un créneau par ligne,
      avec les règles de voix (aucune prédiction — FR-053 ; aucun lexique médical — NFR-008 ; aucune
      revendication d'affect). Chaque texte livré passe automatiquement sous le contrôle bloquant de
      la 2.8 dès qu'il est déposé dans `lib/corpus/`.
      Le même corpus alimente les MANTRAS (5.4), l'ENNÉAGRAMME (5.5) et le SENS DES CARTES (5.7) :
      c'est le plus gros travail d'écriture du produit et il n'a qu'un seul auteur possible.
      ÉTAT AU 2026-08-14, après la 5.7 : 189 créneaux déclarés, 0 écrit — 69 numérologie, 60 mantras,
      27 horoscope, 9 ennéagramme, 24 sens des cartes. L'ordre d'urgence a changé en 5.6 : les 87
      créneaux du QUOTIDIEN (mantras + horoscope) passent devant, parce que l'accueil est le premier
      écran et que deux de ses cinq cartes sont vides sans eux. Le sens des cartes vient en dernier :
      le rituel de lecture n'est pas publiable avant la commande d'art de toute façon (porte ci-dessous).
  - gate: "LES 24 VISUELS DU JEU — commande d'art propriétaire (FR-022)"
    concerne: "Epic 5 (5.7, 5.8) — le rituel de lecture"
    status: open
    note: >
      OUVERTE le 2026-08-14 en livrant la 5.7. FR-022 exige que le jeu soit PROPRIÉTAIRE — « visuels
      créés pour Anima, aucun oracle du commerce embarqué ». C'est une promesse de PRODUIT avant
      d'être une question de droit d'auteur : plusieurs jeux classiques sont dans le domaine public,
      et les recopier resterait une trahison de la promesse faite à l'utilisatrice.
      ÉTAT : le jeu de 24 cartes est déclaré et tirable ; ZÉRO visuel existe. Chaque carte le dit à
      l'écran (« Le visuel de cette carte n'est pas encore dessiné ») plutôt que d'afficher un dos de
      carte générique — un substitut « en attendant » serait littéralement un visuel non créé pour
      Anima, affiché à la place d'un visuel d'Anima.
      IL FAUT DEUX CHOSES PAR CARTE, ET ELLES VONT ENSEMBLE : (a) le VISUEL, sous
      `public/jeu/<cle>.webp` ; (b) la DESCRIPTION LITTÉRALE, dans `lib/corpus/description-cartes.ts`
      — le texte alternatif, qui dit ce qui est DESSINÉ et jamais ce que ça veut dire (un balayage
      bloquant rejette « symbolise », « représente », « évoque », l'adresse à la deuxième personne…).
      Sans description écrite, `render/lecture/visuels.ts` refuse d'afficher le visuel : une image
      sans texte alternatif utilisable ferait recevoir « une image » à une utilisatrice au lecteur
      d'écran, à qui on demanderait ensuite ce qu'elle y voit.
      À TRANCHER AVEC ANIMA AVANT DE COMMANDER : les 24 noms de carte. Ils sont internes (l'UX
      interdit de nommer la carte à l'écran) et renommables aujourd'hui pour le prix d'un UPDATE —
      mais un visuel dessiné fige son nom de fait.
